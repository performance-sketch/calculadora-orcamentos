<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Orçamentos</title>
<style>
  :root{
    --bg:#f4f6f9;
    --card:#ffffff;
    --border:#e3e7ee;
    --text:#1b2333;
    --muted:#6b7280;
    --primary:#3457d5;
    --primary-dark:#243e9e;
    --good:#1a9e6b;
    --good-bg:#e6f7ef;
    --bad:#d64545;
    --bad-bg:#fdeaea;
    --radius:14px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    padding:32px 16px 80px;
  }
  .wrap{max-width:960px;margin:0 auto;}
  header{margin-bottom:28px;}
  header h1{font-size:1.6rem;margin:0 0 4px;}
  header p{margin:0;color:var(--muted);font-size:0.95rem;}

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:22px;
    margin-bottom:22px;
    box-shadow:0 1px 3px rgba(20,30,60,0.04);
  }
  .card h2{margin:0 0 16px;font-size:1.05rem;}

  form.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:14px;
  }
  label{
    display:flex;
    flex-direction:column;
    font-size:0.82rem;
    color:var(--muted);
    gap:6px;
    font-weight:600;
  }
  input{
    font-size:0.95rem;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:9px;
    background:#fbfcfe;
    color:var(--text);
    font-weight:400;
  }
  input:focus{outline:2px solid var(--primary);outline-offset:1px;border-color:var(--primary);}

  .actions{grid-column:1/-1;display:flex;gap:10px;margin-top:4px;}
  button{
    border:none;
    border-radius:9px;
    padding:10px 18px;
    font-size:0.92rem;
    font-weight:600;
    cursor:pointer;
    transition:background .15s;
  }
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}
  .btn-ghost:hover{background:#eef1f6;}

  .summary-row{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:14px;
    margin-bottom:22px;
  }
  .stat{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px 18px;
  }
  .stat .label{font-size:0.78rem;color:var(--muted);font-weight:600;margin-bottom:6px;}
  .stat .value{font-size:1.35rem;font-weight:700;}

  .budgets{display:flex;flex-direction:column;gap:14px;}
  .budget{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px 20px;
    display:flex;
    flex-wrap:wrap;
    gap:18px;
    align-items:center;
    justify-content:space-between;
  }
  .budget .bname{font-weight:700;font-size:1.02rem;flex:1 1 160px;}
  .budget .bname small{display:block;font-weight:400;color:var(--muted);font-size:0.78rem;margin-top:2px;}
  .bstat{min-width:110px;}
  .bstat .l{font-size:0.72rem;color:var(--muted);font-weight:600;}
  .bstat .v{font-size:1.05rem;font-weight:700;}
  .pill{
    display:inline-block;
    padding:3px 10px;
    border-radius:999px;
    font-size:0.78rem;
    font-weight:700;
  }
  .pill-good{background:var(--good-bg);color:var(--good);}
  .pill-bad{background:var(--bad-bg);color:var(--bad);}
  .del{
    background:transparent;
    border:none;
    color:var(--muted);
    font-size:0.8rem;
    cursor:pointer;
    text-decoration:underline;
    padding:0;
  }
  .del:hover{color:var(--bad);}
  .empty{color:var(--muted);text-align:center;padding:30px 0;font-size:0.9rem;}
  @media (max-width:520px){
    .budget{flex-direction:column;align-items:flex-start;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Calculadora de Orçamentos</h1>
    <p>Cadastre seus orçamentos mensais e acompanhe quanto ainda pode gastar por dia.</p>
  </header>

  <div class="summary-row" id="summaryRow"></div>

  <div class="card">
    <h2>Novo orçamento</h2>
    <form class="grid" id="budgetForm">
      <label>Nome
        <input type="text" id="fName" placeholder="Ex: Setembro 2026" required>
      </label>
      <label>Saldo (R$)
        <input type="number" id="fBalance" step="0.01" placeholder="0,00" required>
      </label>
      <label>Data de início
        <input type="date" id="fStart" required>
      </label>
      <label>Data de fim
        <input type="date" id="fEnd" required>
      </label>
      <div class="actions">
        <button type="submit" class="btn-primary">Adicionar orçamento</button>
        <button type="button" class="btn-ghost" id="clearForm">Limpar</button>
      </div>
    </form>
  </div>

  <div class="card">
    <h2>Orçamentos cadastrados</h2>
    <div class="budgets" id="budgetsList"></div>
  </div>
</div>

<script>
const STORAGE_KEY = "calculadora-orcamentos:v1";

function loadBudgets(){
  try{
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  }catch(e){
    return [];
  }
}
function saveBudgets(list){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }catch(e){}
}

function fmtBRL(n){
  return (n || 0).toLocaleString("pt-BR", {style:"currency", currency:"BRL"});
}

function todayISO(){
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}
function parseISO(s){
  const [y,m,d] = s.split("-").map(Number);
  return new Date(y, m-1, d);
}
function daysBetween(a,b){
  return Math.round((b - a) / 86400000);
}

function computeBudget(b){
  const start = parseISO(b.start);
  const end = parseISO(b.end);
  const today = todayISO();

  const remainingValue = b.balance;

  let daysLeft;
  if (today < start){
    daysLeft = daysBetween(start, end) + 1;
  } else if (today > end){
    daysLeft = 0;
  } else {
    daysLeft = daysBetween(today, end) + 1;
  }

  const perDay = daysLeft > 0 ? remainingValue / daysLeft : null;

  const status = remainingValue < 0 ? "bad" : "good";

  return { remainingValue, daysLeft, perDay, status };
}

function render(){
  const list = loadBudgets();
  const listEl = document.getElementById("budgetsList");
  const summaryEl = document.getElementById("summaryRow");
  listEl.innerHTML = "";

  if (list.length === 0){
    listEl.innerHTML = '<div class="empty">Nenhum orçamento cadastrado ainda.</div>';
  }

  let totalBalance = 0, totalPerDay = 0;

  list.forEach((b, idx) => {
    const c = computeBudget(b);
    totalBalance += c.remainingValue;
    if (c.perDay !== null) totalPerDay += c.perDay;

    const pillClass = c.status === "good" ? "pill-good" : "pill-bad";
    const pillText = c.status === "good" ? "Saldo positivo" : "Saldo negativo";

    const el = document.createElement("div");
    el.className = "budget";
    el.innerHTML = `
      <div class="bname">
        ${b.name}
        <small>${b.start.split("-").reverse().join("/")} → ${b.end.split("-").reverse().join("/")}</small>
      </div>
      <div class="bstat"><div class="l">Saldo</div><div class="v">${fmtBRL(c.remainingValue)}</div></div>
      <div class="bstat"><div class="l">Dias restantes</div><div class="v">${c.daysLeft}</div></div>
      <div class="bstat">
        <div class="l">Por dia</div>
        <div class="v">${c.perDay !== null ? fmtBRL(c.perDay) : "—"}</div>
      </div>
      <div class="bstat"><span class="pill ${pillClass}">${pillText}</span></div>
      <button class="del" data-idx="${idx}">Remover</button>
    `;
    listEl.appendChild(el);
  });

  listEl.querySelectorAll(".del").forEach(btn => {
    btn.addEventListener("click", () => {
      const idx = Number(btn.dataset.idx);
      const list = loadBudgets();
      list.splice(idx, 1);
      saveBudgets(list);
      render();
    });
  });

  summaryEl.innerHTML = `
    <div class="stat"><div class="label">Saldo total</div><div class="value">${fmtBRL(totalBalance)}</div></div>
    <div class="stat"><div class="label">Disponível/dia (soma)</div><div class="value">${fmtBRL(totalPerDay)}</div></div>
  `;
}

document.getElementById("budgetForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const name = document.getElementById("fName").value.trim();
  const balance = parseFloat(document.getElementById("fBalance").value);
  const start = document.getElementById("fStart").value;
  const end = document.getElementById("fEnd").value;

  if (!name || isNaN(balance) || !start || !end) return;
  if (parseISO(end) < parseISO(start)){
    alert("A data de fim precisa ser depois da data de início.");
    return;
  }

  const list = loadBudgets();
  list.push({ name, balance, start, end });
  saveBudgets(list);
  e.target.reset();
  render();
});

document.getElementById("clearForm").addEventListener("click", () => {
  document.getElementById("budgetForm").reset();
});

render();
</script>
</body>
</html>
